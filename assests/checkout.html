<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>E-Shop Checkout</title>
    <style>
        .error { color: red; }
        #pay-now-btn { background-color: green; color: white; }
    </style>
</head>
<body>
    <h1>E-Shop Checkout</h1>
    
    <section id="products">
        <h2>Items in Cart</h2>
        <div id="cart-item-1">
            <p>Product A: $50.00</p>
            <input type="number" id="qty-A" name="quantity-A" value="1" min="1">
        </div>
        <p>Current Subtotal: $<span id="subtotal">50.00</span></p>
    </section>
    
    <hr>
    
    <section id="discount-section">
        <h2>Discount Code</h2>
        <input type="text" id="discount-code-input" placeholder="Enter code">
        <button id="apply-discount-btn">Apply</button>
        <p id="discount-message"></p>
    </section>
    
    <hr>
    
    <form id="checkout-form">
        <h2>User Details</h2>
        <label for="full-name">Name:</label>
        <input type="text" id="full-name" name="name" required>
        <p id="name-error" class="error" style="display:none;">Name is required.</p>

        <label for="user-email">Email:</label>
        <input type="email" id="user-email" name="email" required>
        
        <h2>Shipping Method</h2>
        <input type="radio" id="standard-shipping" name="shipping-method" value="Standard" checked>
        <label for="standard-shipping">Standard (Free)</label><br>
        <input type="radio" id="express-shipping" name="shipping-method" value="Express">
        <label for="express-shipping">Express ($10.00)</label>

        <hr>
        
        <button type="submit" id="pay-now-btn">Pay Now</button>
    </form>
    
    <p id="payment-status" style="display:none;">Payment Successful!</p>
</body>
</html>
